<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deployden Marketing{% if title %}: {{ title }}{% endif %}</title>
<script src="/static/htmx.min.js"></script>
<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="/static/v2.css">
</head>
<body>

<a class="skip-link" href="#main">Skip to main content</a>

<nav class="sidebar" id="sidebar">
  <div class="sidebar-brand">
    <div class="logo" aria-hidden="true">D</div>
    <span>Deployden <small>Marketing OS</small></span>
  </div>
  <div class="sidebar-nav">
    <div class="sidebar-section">Workspace</div>
    <a href="/dashboard" class="{% if active in ['dashboard','brands','engagements'] %}active{% endif %}">
      <span class="nav-icon" aria-hidden="true">&#9632;</span> Portfolio
    </a>
    <a href="/content" class="{% if active == 'content' %}active{% endif %}">
      <span class="nav-icon" aria-hidden="true">&#9998;</span> Editorial
    </a>
    <a href="/calendar" class="{% if active == 'calendar' %}active{% endif %}">
      <span class="nav-icon" aria-hidden="true">&#9636;</span> Calendar
    </a>
    <a href="/reports" class="{% if active == 'reports' %}active{% endif %}">
      <span class="nav-icon" aria-hidden="true">&#9776;</span> Reports
    </a>
    <a href="/tasks" class="{% if active == 'tasks' %}active{% endif %}">
      <span class="nav-icon" aria-hidden="true">&#10003;</span> Work queue
    </a>

    <div class="sidebar-section admin-section">Administration</div>
    <a href="/alerts" class="{% if active == 'alerts' %}active{% endif %}">
      <span class="nav-icon" aria-hidden="true">&#9888;</span> Alerts
      {% if nav_alert_count %}<span class="nav-count">{{ nav_alert_count }}</span>{% endif %}
    </a>
    <a href="/operations" class="{% if active == 'operations' %}active{% endif %}">
      <span class="nav-icon" aria-hidden="true">&#9881;</span> Operations
    </a>
    <a href="/administration" class="{% if active == 'administration' %}active{% endif %}">
      <span class="nav-icon" aria-hidden="true">&#9881;</span> Administration
    </a>
  </div>
</nav>

<button class="menu-toggle" id="menuToggle" type="button" aria-controls="sidebar" aria-expanded="false" onclick="toggleSidebar()"><span aria-hidden="true">&#9776;</span><span class="sr-only">Open navigation</span></button>
<button class="theme-toggle" id="themeToggle" type="button" aria-pressed="false" onclick="toggleTheme()" title="Use dark theme"><span aria-hidden="true">&#9790;</span><span class="sr-only">Toggle color theme</span></button>

<div class="main" id="main">
  {% block content %}{{ content|safe }}{% endblock %}
</div>

<script>
(function() {
  var t = localStorage.getItem('theme') || 'light';
  document.documentElement.setAttribute('data-theme', t);
  updateThemeControl(t);
})();
function toggleTheme() {
  var h = document.documentElement;
  var cur = h.getAttribute('data-theme');
  var next = cur === 'dark' ? 'light' : 'dark';
  h.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
  updateThemeControl(next);
}
function updateThemeControl(theme) {
  var control = document.getElementById('themeToggle');
  control.setAttribute('aria-pressed', theme === 'dark' ? 'true' : 'false');
  control.title = theme === 'dark' ? 'Use light theme' : 'Use dark theme';
  control.querySelector('[aria-hidden="true"]').textContent = theme === 'dark' ? '☀' : '☾';
}
function toggleSidebar() {
  var sidebar = document.getElementById('sidebar');
  var open = sidebar.classList.toggle('open');
  document.getElementById('menuToggle').setAttribute('aria-expanded', open ? 'true' : 'false');
}
document.addEventListener('click', function(e) {
  var s = document.getElementById('sidebar');
  var t = document.getElementById('menuToggle');
  if (window.innerWidth <= 820 && !s.contains(e.target) && !t.contains(e.target)) {
    s.classList.remove('open');
    t.setAttribute('aria-expanded', 'false');
  }
});
function setPoll(el, target, url) {
  var val = el.value;
  var t = document.getElementById(target);
  t.setAttribute('hx-trigger', 'load, every ' + val + 's');
  t.setAttribute('hx-get', url + '?poll=' + val);
  htmx.process(t);
}
</script>
</body>
</html>
