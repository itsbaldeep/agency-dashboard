{% extends "base.html" %}
{% block content %}
<div class="page-header">
  <h1>Editorial</h1>
  <div class="sub">Blog posts and help articles across brands</div>
  <a href="/content/new" class="btn btn-primary">Research article</a>
  <a href="/content/calendar" class="btn">Editorial calendar</a>
</div>

<div id="tab-articles" class="tab-content">
  <div id="content-main"
       hx-get="/content/data"
       hx-trigger="load, every 15s"
       hx-select="#content-main"
       hx-swap="outerHTML">

  </div>
</div>

{% endblock %}
