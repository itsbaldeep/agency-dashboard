{% extends "base.html" %}
{% block content %}
<div class="page-header">
  <h1>Dashboard</h1>
  <div class="sub">System health, activity &amp; pending items</div>
</div>

<div id="overview-main"
     hx-get="/dashboard/data"
     hx-trigger="load, every 15s"
     hx-select="#overview-main"
     hx-swap="outerHTML">
  <div class="stats">
    {% for _ in range(6) %}
    <div class="stat-card"><div class="skel skel-h" style="width:40%;margin:0 auto 6px"></div><div class="skel skel-s" style="width:60%;margin:0 auto"></div></div>
    {% endfor %}
  </div>
  <div class="card"><div class="skel skel-h" style="width:20%"></div><div class="skel skel-block"></div><div class="skel skel-s" style="width:40%"></div></div>
</div>
{% endblock %}
