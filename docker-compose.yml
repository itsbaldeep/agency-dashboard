services:
  dashboard:
    build: .
    command: ["gunicorn", "--bind", "0.0.0.0:80", "--workers", "2", "--threads", "4", "--timeout", "60", "app:app"]
    container_name: agency-dashboard
    restart: unless-stopped
    networks:
      - net-control
    ports:
      - "100.64.0.1:5001:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /home/agency/agency-os/caddy-apps:/caddy-apps:ro
      - /home/agency/agency-os/scripts:/home/agency/agency-os/scripts:ro
      - /home/agency/agency-os/config:/agency-config:ro
    env_file: /home/agency/agency-os/.env
    environment:
      DB_HOST: agency-postgres
      DB_NAME: agencyos
      DB_USER: agency
      CH_HOST: agency-clickhouse
      CH_USER: agency
      BIND_HOST: "0.0.0.0"
      BIND_PORT: "80"

networks:
  net-control:
    external: true
