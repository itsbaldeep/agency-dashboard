services:
  dashboard:
    build: .
    command: ["gunicorn", "--bind", "0.0.0.0:8000", "--workers", "2", "--threads", "4", "--timeout", "60", "app:app"]
    container_name: agency-dashboard
    group_add:
      - "1001"
    restart: unless-stopped
    networks:
      - net-control
    ports:
      - "100.64.0.1:5001:8000"
    volumes:
      - /home/agency/.local/state/agency-os:/agency-state:ro
      - /home/agency/agency-os/caddy-apps:/caddy-apps:ro
      - /home/agency/agency-os/scripts:/home/agency/agency-os/scripts:ro
      - /home/agency/agency-os/config:/agency-config:ro
      - /home/agency/.local/share/agency-marketing:/home/agency/.local/share/agency-marketing
      - /home/agency/core/deployden/data:/agency-enquiries/27:ro
    environment:
      DB_HOST: agency-postgres
      DB_NAME: agencyos
      DB_USER: agency
      DB_PASS: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      CH_HOST: agency-clickhouse
      CH_USER: agency
      CH_PASS: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      BIND_HOST: "0.0.0.0"
      BIND_PORT: "8000"
      AGENCY_S3_ENDPOINT: agency-minio:9000
      AGENCY_S3_BUCKET: agency-editorial
      AGENCY_S3_PUBLIC_BASE: https://assets.apps.deployden.tech
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}
      AGENCY_CORE_ENQUIRY_OWNERS: "27:10"
    env_file:
      - /home/agency/.config/agency/assets.env

networks:
  net-control:
    external: true
