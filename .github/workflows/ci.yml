name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  compile-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m py_compile app.py models.py
      - run: pip install flask psycopg2-binary markdown
      - run: python3 -m py_compile app.py
