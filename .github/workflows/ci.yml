name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  compile-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: itsbaldeep/agency-os
          ref: fd8c8852bb1e04653460557f91f2379d1765c8b4
          path: core/agency-os
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m py_compile app.py models.py
      - run: pip install -r requirements.txt
      - run: python3 -m py_compile app.py
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
        env:
          AGENCY_SCRIPT_DIR: ${{ github.workspace }}/core/agency-os/scripts
